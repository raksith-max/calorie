# Render Blueprint: New + > Blueprint, pick your GitHub repo.
# The disk keeps your meal history between deploys (needs a paid instance).
services:
  - type: web
    name: plate
    runtime: node
    plan: starter
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: USDA_API_KEY
        sync: false
      - key: DB_PATH
        value: /var/data/data.db
    disk:
      name: plate-data
      mountPath: /var/data
      sizeGB: 1
